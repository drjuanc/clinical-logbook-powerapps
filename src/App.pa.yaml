App:
  Properties:
    Theme: =PowerAppsTheme
    BackEnabled: =false
    Formulas: |
      =// =====================================================================
      // WSU CLINICAL LOGBOOK - DESIGN TOKENS
      // Palette derived from docs/design/WSU_new_logo.png. Full rationale and
      // WCAG contrast figures: docs/THEME.md.
      // Screens reference these names ONLY - never a raw hex value.
      // =====================================================================

      // ---- Brand -----------------------------------------------------------
      ThemePrimary = ColorValue("#551516");        // wordmark maroon; 12.67:1
      ThemePrimaryDeep = ColorValue("#3A0E0F");    // pressed / max emphasis
      ThemePrimaryLight = ColorValue("#7A2B2C");   // hover / secondary brand
      ThemeAccent = ColorValue("#CF8029");         // amber - FILLS ONLY, 2.82:1
      ThemeAccentDeep = ColorValue("#8A5316");     // text-safe amber; 5.73:1

      // ---- Neutrals (warm-tinted to sit with the maroon) -------------------
      ThemeInk = ColorValue("#1C1416");            // body text; 16.42:1
      ThemeInkMuted = ColorValue("#5C4F52");       // subtitles; 7.08:1
      ThemeInkSubtle = ColorValue("#736467");      // captions; 5.09:1
      ThemeLine = ColorValue("#E5DCDD");           // decorative dividers only
      ThemeLineStrong = ColorValue("#8F8083");     // meaningful borders; 3.42:1
      ThemeSurface = ColorValue("#FFFFFF");
      ThemeSurfaceAlt = ColorValue("#F7F3F3");
      ThemeCanvas = ColorValue("#FAF7F6");

      // ---- Semantic --------------------------------------------------------
      ThemeSuccess = ColorValue("#3D5A3E");
      ThemeWarning = ColorValue("#8A5316");
      ThemeError = ColorValue("#9A1B1E");
      ThemeSuccessTint = ColorValue("#EDF3ED");
      ThemeWarningTint = ColorValue("#FDF3E4");
      ThemeErrorTint = ColorValue("#FBECEC");
      ThemeAccentTint = ColorValue("#FDF1E3");

      // ---- Type ------------------------------------------------------------
      ThemeFont = Font.'Open Sans';
      ThemeSizeDisplay = 28;
      ThemeSizeHeading = 22;
      ThemeSizeSubhead = 17;
      ThemeSizeBody = 15;
      ThemeSizeCaption = 13;

      // ---- Spacing / shape / touch ----------------------------------------
      ThemeSpaceXS = 4;
      ThemeSpaceS = 8;
      ThemeSpaceM = 16;
      ThemeSpaceL = 24;
      ThemeSpaceXL = 32;
      ThemeRadius = 12;
      ThemeRadiusSmall = 8;
      ThemeTouchTarget = 48;                       // WCAG 2.5.5 thumb minimum

      // ---- Brand asset -----------------------------------------------------
      // Embedded as a data URI so the app is self-contained and the logo is
      // versioned in git. Swap for an uploaded media resource if preferred -
      // see decision note in the handover.
      ThemeLogo = "data:image/png;base64,";
